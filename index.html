  function tr(key){ return strings[key][state.en?1:0]; }

  function autoFitZoom(){
    var maxDim = Math.max(state.width, state.height);
    var fit = Math.round((420/(maxDim*BASE_CELL))*100/25)*25;
    state.zoom = Math.max(50, Math.min(200, fit || 100));
  }

  function loadDraft(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      var data = JSON.parse(raw);
      if(!data || !Array.isArray(data.cells) || !data.width || !data.height) return false;
      state.width = data.width; state.height = data.height; state.kind = data.kind || "blank";
      state.title = typeof data.title === "string" ? data.title : state.title;
      state.cells = data.cells;
      return true;
    }catch(e){ return false; }
  }

  function saveDraft(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({width:state.width,height:state.height,kind:state.kind,title:state.title,cells:state.cells}));
    }catch(e){ /* storage unavailable or full — draft simply won't persist */ }
  }

  function loadGallery(){
    try{ var list = JSON.parse(localStorage.getItem(GALLERY_KEY) || "[]"); return Array.isArray(list) ? list : []; }
    catch(e){ return []; }
  }

  function saveGalleryList(list){
    try{ localStorage.setItem(GALLERY_KEY, JSON.stringify(list)); }catch(e){ /* storage unavailable or full */ }
  }

  function saveToGallery(){
    var list = loadGallery();
    list.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      title: state.title || tr("customTitle"),
      width: state.width, height: state.height, kind: state.kind,
      cells: state.cells.slice(), savedAt: Date.now()
    });
    if(list.length > GALLERY_LIMIT) list = list.slice(0, GALLERY_LIMIT);
    saveGalleryList(list);
    renderGallery();
    toast(tr("savedToGalleryToast"));
  }

  function loadFromGallery(id){
    var item = loadGallery().filter(function(i){ return i.id === id; })[0];
    if(!item) return;
    state.width = item.width; state.height = item.height; state.kind = item.kind || "blank";
    state.cells = item.cells.slice(); state.title = item.title;
    titleInput.value = state.title;
    autoFitZoom();
    renderAll(); saveDraft(); commitHistory();
  }

  function deleteFromGallery(id){
    saveGalleryList(loadGallery().filter(function(i){ return i.id !== id; }));
    renderGallery();
  }

  var shelfBody = document.getElementById("shelfBody");
  var galleryBody = document.getElementById("galleryBody");
  var sizeGrid = document.getElementById("sizeGrid");
  var sizeSummary = document.getElementById("sizeSummary");
  var paletteEl = document.getElementById("palette");
  var currentSwatch = document.getElementById("currentSwatch");
  var customColor = document.getElementById("customColor");
  var miniCanvas = document.getElementById("miniCanvas");
  var titleInput = document.getElementById("titleInput");
  var shelfActiveTitle = document.getElementById("shelfActiveTitle");
  var pixelCount = document.getElementById("pixelCount");
  var toolPencil = document.getElementById("toolPencil");
  var toolEraser = document.getElementById("toolEraser");
  var toolFill = document.getElementById("toolFill");
  var toolEyedropper = document.getElementById("toolEyedropper");
  var mirrorBtn = document.getElementById("mirrorBtn");
  var undoBtn = document.getElementById("undoBtn");
  var redoBtn = document.getElementById("redoBtn");
  var zoomLabel = document.getElementById("zoomLabel");
  var toastEl = document.getElementById("toast");

  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  var history = { stack: [], index: -1 };
  function snapshot(){ return { width:state.width, height:state.height, kind:state.kind, cells:state.cells.slice() }; }
  function commitHistory(){
    history.stack = history.stack.slice(0, history.index+1);
    history.stack.push(snapshot());
    history.index = history.stack.length - 1;
    if(history.stack.length > 60){ history.stack.shift(); history.index--; }
    renderHistoryButtons();
  }
  function restoreSnapshot(snap){
    state.width = snap.width; state.height = snap.height; state.kind = snap.kind; state.cells = snap.cells.slice();
    renderShelf(); renderSizeGrid(); renderCanvas(); saveDraft();
  }
  function undo(){ if(history.index > 0){ history.index--; restoreSnapshot(history.stack[history.index]); renderHistoryButtons(); } }
  function redo(){ if(history.index < history.stack.length-1){ history.index++; restoreSnapshot(history.stack[history.index]); renderHistoryButtons(); } }
  function renderHistoryButtons(){
    undoBtn.disabled = history.index <= 0;
    redoBtn.disabled = history.index >= history.stack.length-1;
  }

  function makeThumb(kind){
    var cells = sketchTemplate(16,16,kind);
    var wrap = document.createElement("div");
    wrap.className = "thumb";
    wrap.style.gridTemplateColumns = "repeat(16,1fr)";
    cells.forEach(function(c){
      var i = document.createElement("i");
      i.style.background = c;
      wrap.appendChild(i);
    });
    return wrap;
  }

  function makeThumbFromCells(cells,width,height){
    var square = squareThumbCells(cells,width,height);
    var wrap = document.createElement("div");
    wrap.className = "thumb";
    wrap.style.gridTemplateColumns = "repeat(16,1fr)";
    square.forEach(function(c){
      var i = document.createElement("i");
      i.style.background = c;
      wrap.appendChild(i);
    });
    return wrap;
  }

  function renderShelf(){
    shelfBody.innerHTML = "";
    sketchExamples.forEach(function(item){
      var btn = document.createElement("button");
      if(item.kind === state.kind) btn.classList.add("on");
      btn.appendChild(makeThumb(item.kind));
      var span = document.createElement("span");
      var b = document.createElement("b"); b.textContent = state.en ? item.titleEn : item.title;
      var small = document.createElement("small"); small.textContent = (state.en ? item.genreEn : item.genre) + " · " + item.width + "×" + item.height;
      span.appendChild(b); span.appendChild(small);
      btn.appendChild(span);
      btn.appendChild(document.createTextNode(item.kind === state.kind ? tr("active") : tr("edit")));
      btn.addEventListener("click", function(){ newSketch(item.width, item.height, item.kind, state.en?item.titleEn:item.title); });
      shelfBody.appendChild(btn);
    });
    var match = sketchExamples.filter(function(i){ return i.kind === state.kind; })[0];
    shelfActiveTitle.textContent = match ? (state.en ? match.titleEn : match.title) : (state.title || tr("customTitle"));
  }

  function renderGallery(){
    var list = loadGallery();
    galleryBody.innerHTML = "";
    var addCard = document.createElement("button");
    addCard.type = "button";
    addCard.className = "galleryAdd";
    addCard.textContent = tr("galleryAddCard");
    addCard.addEventListener("click", saveToGallery);
    galleryBody.appendChild(addCard);
    if(!list.length){
      var empty = document.createElement("div");
      empty.className = "hint galleryEmpty";
      empty.textContent = tr("galleryEmpty");
      galleryBody.appendChild(empty);
      return;
    }
    list.forEach(function(item){
      var card = document.createElement("div");
      card.className = "galleryCard";
      var loadBtn = document.createElement("button");
      loadBtn.type = "button";
      loadBtn.className = "loadArea";
      loadBtn.appendChild(makeThumbFromCells(item.cells, item.width, item.height));
      var b = document.createElement("b"); b.textContent = item.title || tr("customTitle");
      var small = document.createElement("small"); small.textContent = item.width + "×" + item.height;
      loadBtn.appendChild(b); loadBtn.appendChild(small);
      loadBtn.addEventListener("click", function(){ loadFromGallery(item.id); });
      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "delBtn";
      delBtn.textContent = "×";
      delBtn.setAttribute("aria-label", tr("galleryDelete"));
      delBtn.addEventListener("click", function(){ if(confirm(tr("galleryConfirmDelete"))) deleteFromGallery(item.id); });
      card.appendChild(loadBtn); card.appendChild(delBtn);
      galleryBody.appendChild(card);
    });
  }

  function renderSizeGrid(){
    sizeGrid.innerHTML = "";
    sizePresets.forEach(function(p){
      var w=p[0], h=p[1], labelZh=p[2], labelEn=p[3];
      var btn = document.createElement("button");
      if(state.width===w && state.height===h) btn.classList.add("on");
      btn.innerHTML = "<b>"+w+"×"+h+"</b><br><small>"+(state.en?labelEn:labelZh)+"</small>";
      btn.addEventListener("click", function(){ resizeSketch(w,h); });
      sizeGrid.appendChild(btn);
    });
    sizeSummary.textContent = state.width + " × " + state.height + " " + (state.en?"canvas":"画布");
  }

  function renderPalette(){
    paletteEl.innerHTML = "";
    palette.forEach(function(c){
      var btn = document.createElement("button");
      btn.style.background = c;
      if(state.color===c) btn.classList.add("on");
      btn.setAttribute("aria-label", c);
      btn.addEventListener("click", function(){ state.color=c; state.tool="pencil"; renderPalette(); renderTools(); });
      paletteEl.appendChild(btn);
    });
    currentSwatch.style.background = state.color;
    if(HEX_RE.test(state.color)) customColor.value = state.color;
  }

  function renderTools(){
    toolPencil.classList.toggle("on", state.tool==="pencil");
    toolEraser.classList.toggle("on", state.tool==="eraser");
    toolFill.classList.toggle("on", state.tool==="fill");
    toolEyedropper.classList.toggle("on", state.tool==="eyedropper");
    mirrorBtn.classList.toggle("on", state.mirror);
  }

  var dragging = false;
  var strokeBefore = null;

  function renderCanvas(){
    var cellPx = BASE_CELL * (state.zoom/100);
    miniCanvas.style.gridTemplateColumns = "repeat("+state.width+","+cellPx+"px)";
    miniCanvas.style.width = (state.width*cellPx)+"px";
    miniCanvas.innerHTML = "";
    state.cells.forEach(function(c, i){
      var cell = document.createElement("div");
      cell.style.background = c;
      cell.style.height = cellPx+"px";
      cell.addEventListener("mousedown", function(){ handlePointerDown(i); });
      cell.addEventListener("mouseenter", function(){ if(dragging) handlePointerMove(i); });
      cell.addEventListener("touchstart", function(e){ e.preventDefault(); handlePointerDown(i); }, {passive:false});
      miniCanvas.appendChild(cell);
    });
    pixelCount.textContent = state.width + " × " + state.height + " · " + (state.width*state.height).toLocaleString() + " " + tr("pixelsWord");
    zoomLabel.textContent = state.zoom + "%";
  }

  function handlePointerDown(index){
    if(state.tool==="fill"){ floodFill(index); return; }
    if(state.tool==="eyedropper"){ pickColor(index); return; }
    strokeBefore = state.cells.slice();
    dragging = true;
    paintCell(index);
  }

  function handlePointerMove(index){
    if(state.tool==="fill" || state.tool==="eyedropper") return;
    paintCell(index);
  }

  function endStroke(){
    if(dragging && strokeBefore){
      var changed = false;
      for(var i=0;i<state.cells.length;i++){ if(state.cells[i]!==strokeBefore[i]){ changed=true; break; } }
      if(changed) commitHistory();
    }
    dragging = false;
    strokeBefore = null;
  }
  document.addEventListener("mouseup", endStroke);
  miniCanvas.addEventListener("mouseleave", endStroke);
  miniCanvas.addEventListener("touchend", endStroke);
  miniCanvas.addEventListener("touchcancel", endStroke);
  miniCanvas.addEventListener("touchmove", function(e){
    if(!dragging) return;
    e.preventDefault();
    var t = e.touches[0];
    if(!t) return;
    var el = document.elementFromPoint(t.clientX, t.clientY);
    if(el && el.parentNode===miniCanvas){
      var idx = Array.prototype.indexOf.call(miniCanvas.children, el);
      if(idx>=0) handlePointerMove(idx);
    }
  }, {passive:false});

  function setCell(index, value){
    state.cells[index] = value;
    var el = miniCanvas.children[index];
    if(el) el.style.background = value;
  }

  function paintCell(index){
    var value = state.tool==="eraser" ? "#FFFFFF" : state.color;
    setCell(index, value);
    if(state.mirror){
      var x = index % state.width, y = Math.floor(index/state.width);
      var mx = state.width-1-x;
      if(mx!==x) setCell(y*state.width+mx, value);
    }
    saveDraft();
  }

  function floodFill(index){
    var target = state.cells[index];
    var replacement = state.color;
    if(target===replacement) return;
    var w=state.width, h=state.height;
    var visited = new Uint8Array(w*h);
    var stack = [index];
    while(stack.length){
      var idx = stack.pop();
      if(visited[idx] || state.cells[idx]!==target) continue;
      visited[idx] = 1;
      state.cells[idx] = replacement;
      var x=idx%w, y=Math.floor(idx/w);
      if(x>0) stack.push(idx-1);
      if(x<w-1) stack.push(idx+1);
      if(y>0) stack.push(idx-w);
      if(y<h-1) stack.push(idx+w);
    }
    renderCanvas();
    saveDraft();
    commitHistory();
  }

  function pickColor(index){
    state.color = state.cells[index];
    state.tool = "pencil";
    renderPalette();
    renderTools();
  }

  function newSketch(width,height,kind,title){
    state.width=width; state.height=height; state.kind=kind; state.cells=sketchTemplate(width,height,kind);
    state.title = title || tr("customTitle");
    titleInput.value = state.title;
    autoFitZoom();
    renderAll(); saveDraft(); commitHistory();
  }

  function resizeSketch(width,height){
    var oldWidth=state.width, oldHeight=state.height, previous=state.cells;
    var next = new Array(width*height);
    for(var index=0;index<next.length;index++){
      var x=index%width, y=Math.floor(index/width);
      var sourceX=Math.min(oldWidth-1, Math.floor(x/width*oldWidth));
      var sourceY=Math.min(oldHeight-1, Math.floor(y/height*oldHeight));
      next[index] = previous[sourceY*oldWidth+sourceX] || "#FFFFFF";
    }
    state.width=width; state.height=height; state.cells=next;
    autoFitZoom();
    renderAll(); saveDraft(); commitHistory();
  }

  function clearCanvas(){
    state.cells = sketchTemplate(state.width, state.height, state.kind);
    renderCanvas(); saveDraft(); commitHistory();
  }

  function downloadSketch(){
    var scale = Math.max(1, Math.floor(512/Math.max(state.width,state.height)));
    var canvas = document.createElement("canvas");
    canvas.width = state.width*scale; canvas.height = state.height*scale;
    var ctx = canvas.getContext("2d");
    if(!ctx) return;
    ctx.imageSmoothingEnabled = false;
    state.cells.forEach(function(cell,index){
      ctx.fillStyle = cell;
      ctx.fillRect((index%state.width)*scale, Math.floor(index/state.width)*scale, scale, scale);
    });
    var link = document.createElement("a");
    var safeName = (state.title||"").replace(/[\\/:*?"<>|]/g,"-") || (state.en?"pixel-avatar":"像素头像");
    link.download = safeName + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    toast(tr("exportedToast"));
  }

  function encodeState(){
    var paletteMap = {}, paletteArr = [];
    var indices = state.cells.map(function(c){
      if(!(c in paletteMap)){ paletteMap[c] = paletteArr.length; paletteArr.push(c); }
      return paletteMap[c].toString(36);
    }).join("");
    var payload = { w:state.width, h:state.height, t:state.title, p:paletteArr, d:indices };
    return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  }

  function decodeState(b64){
    try{
      var payload = JSON.parse(decodeURIComponent(escape(atob(b64))));
      if(!payload || !payload.w || !payload.h || !Array.isArray(payload.p) || typeof payload.d!=="string") return null;
      if(payload.w<1 || payload.h<1 || payload.w>MAX_SHARE_DIM || payload.h>MAX_SHARE_DIM) return null;
      if(payload.d.length !== payload.w*payload.h) return null;
      var safePalette = payload.p.map(function(c){ return HEX_RE.test(c) ? c : "#FFFFFF"; });
      var cells = [];
      for(var i=0;i<payload.d.length;i++){
        var idx = parseInt(payload.d[i],36);
        cells.push(safePalette[idx] !== undefined ? safePalette[idx] : "#FFFFFF");
      }
      return { width:payload.w, height:payload.h, title: typeof payload.t==="string" ? payload.t.slice(0,40) : "", cells:cells };
    }catch(e){ return null; }
  }

  function copyShareLink(){
    var url = location.origin + location.pathname + "#s=" + encodeState();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast(tr("linkCopied")); }).catch(function(){ window.prompt(tr("copyManually"), url); });
    } else {
      window.prompt(tr("copyManually"), url);
    }
  }

  function applyStrings(){
    document.documentElement.lang = state.en ? "en" : "zh-CN";
    document.querySelectorAll("[data-t]").forEach(function(el){
      var key = el.getAttribute("data-t");
      if(strings[key]) el.textContent = tr(key);
    });
    document.getElementById("langZh").classList.toggle("on", !state.en);
    document.getElementById("langEn").classList.toggle("on", state.en);
  }

  function renderAll(){
    applyStrings();
    renderShelf();
    renderGallery();
    renderSizeGrid();
    renderPalette();
    renderTools();
    renderCanvas();
    renderHistoryButtons();
  }

  document.getElementById("langZh").addEventListener("click", function(){ state.en=false; renderAll(); });
  document.getElementById("langEn").addEventListener("click", function(){ state.en=true; renderAll(); });
  toolPencil.addEventListener("click", function(){ state.tool="pencil"; renderTools(); });
  toolEraser.addEventListener("click", function(){ state.tool="eraser"; renderTools(); });
  toolFill.addEventListener("click", function(){ state.tool="fill"; renderTools(); });
  toolEyedropper.addEventListener("click", function(){ state.tool="eyedropper"; renderTools(); });
  mirrorBtn.addEventListener("click", function(){ state.mirror=!state.mirror; renderTools(); });
  undoBtn.addEventListener("click", undo);
  redoBtn.addEventListener("click", redo);
  document.getElementById("clearBtn").addEventListener("click", clearCanvas);
  document.getElementById("saveGalleryBtn").addEventListener("click", saveToGallery);
  document.getElementById("shareBtn").addEventListener("click", copyShareLink);
  document.getElementById("exportBtn").addEventListener("click", downloadSketch);
  document.getElementById("zoomIn").addEventListener("click", function(){ state.zoom = Math.min(300, state.zoom+25); renderCanvas(); });
  document.getElementById("zoomOut").addEventListener("click", function(){ state.zoom = Math.max(50, state.zoom-25); renderCanvas(); });
  customColor.addEventListener("input", function(){ state.color = customColor.value.toUpperCase(); state.tool="pencil"; renderPalette(); renderTools(); });
  titleInput.addEventListener("input", function(){ state.title = titleInput.value; saveDraft(); });

  document.addEventListener("keydown", function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if(tag==="INPUT" || tag==="TEXTAREA") return;
    if(!(e.ctrlKey || e.metaKey)) return;
    if(e.key==="z" || e.key==="Z"){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
    else if(e.key==="y" || e.key==="Y"){ e.preventDefault(); redo(); }
  });

  var loadedFrom = "template";
  if(location.hash.indexOf("#s=")===0){
    var shared = decodeState(location.hash.slice(3));
    if(shared){
      state.width=shared.width; state.height=shared.height; state.kind="shared";
      state.title = shared.title || tr("customTitle");
      state.cells = shared.cells;
      loadedFrom = "shared";
      try{ window.history.replaceState(null, "", location.pathname+location.search); }catch(e){}
    } else {
      loadedFrom = "invalid";
    }
  } else if(loadDraft()){
    loadedFrom = "draft";
  }
  autoFitZoom();
  titleInput.value = state.title;
  renderAll();
  commitHistory();
  if(loadedFrom==="shared"){ saveDraft(); toast(tr("sharedLoaded")); }
  else if(loadedFrom==="invalid"){ toast(tr("linkInvalid")); }
})();
</script>
</body>
</html>
